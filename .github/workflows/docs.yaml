name: Deploy documentation

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to.
        default: development
        required: true
        type: environment
  push:
    paths:
      # Only trigger on changes to documentation files.
      - 'docs/**'
      - 'zensical.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs.yaml'
      - '*.md'
    branches:
      - main

permissions:
  contents: read
  id-token: write

run-name: Deploy documentation to ${{ inputs.environment || 'development' }}

jobs:
  build:
    uses: codeforamerica/github-actions/.github/workflows/zensical-build.yaml@main

  deploy:
    needs: build
    uses: codeforamerica/github-actions/.github/workflows/shared-services-documentation-deploy.yaml@main
    with:
      artifact-ids: ${{ needs.build.outputs.artifact-id }}
      environment: ${{ inputs.environment || 'development' }}
    secrets: inherit
